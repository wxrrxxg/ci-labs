name: Multi-Job CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

env:
  APP_NAME: ci-labs
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: echo "Checking code style..."

      - run: echo "Lint passed!"

  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - run: npm test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: echo "Scanning for vulnerabilities..."

      - run: echo "No vulnerabilities found!"

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - run: echo "Build succeeded on main! Would send a Slack/email notification here."


  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: staging

    steps:
      - run: echo "Deploying ${{ env.APP_NAME }} to staging..."
      - run: echo "Using staging key ${{ secrets.STAGING_KEY }}"