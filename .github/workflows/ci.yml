name: Node.js CI

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'package.json'

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log verbosity'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
          retention-days: 7

      - name: Show log level
        run: echo "Log level is ${{ github.event.inputs.log_level || 'not set' }}"